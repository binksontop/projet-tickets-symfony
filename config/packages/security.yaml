security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # les utilisateurs (administrateur et personnel) sont stockes dans la table user
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true

                username_parameter: email

                password_parameter: password
            logout:
                path: app_logout

    # la page d'accueil reste accessible a tous les visiteurs
    # les tickets demandent une connexion, l'administration demande le role admin
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/tickets, roles: IS_AUTHENTICATED_FULLY }